name: 🐛 Bug Report
description: Report a bug or unexpected behavior in PCS validation tests or demos
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the form below.
        
        **Note:** For questions about usage or architecture, please use [GitHub Discussions](https://github.com/persistra-ai/persistra-cts/discussions) instead.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - Validation Tests
        - Demo (Acts 1-9)
        - Documentation
        - Scripts (preflight, validation, etc.)
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run command '...'
        2. See error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your environment details
      value: |
        - OS: [e.g., macOS 14.0, Ubuntu 22.04, Windows 11]
        - Node version: [e.g., 18.16.0]
        - Setup method: [Codespaces / Local]
        - Repository version: [e.g., latest from main, commit hash]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Message / Logs
      description: Full error message or relevant logs
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem (screenshots, related issues, etc.)

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please confirm you've done the following
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have run `npm run preflight` to check environment
          required: false
        - label: I have reviewed TROUBLESHOOTING.md
          required: false
        - label: I have reviewed FAQ.md
          required: false
